<!DOCTYPE html>

<html lang="uk">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Space</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      background: #101114;

      color: #f3f3f5;

    }

    header {

      padding: 28px 22px;

      border-bottom: 1px solid #2c2d33;

    }

    .tag {

      color: #a99bff;

      font-size: 12px;

      letter-spacing: 2px;

    }

    h1 { margin: 12px 0 6px; font-size: 32px; }

    p { color: #a5a6b0; line-height: 1.5; }

    main { max-width: 900px; margin: auto; padding: 24px 18px; }

    input {

      width: 100%;

      padding: 14px;

      margin: 10px 0 24px;

      background: #1b1c22;

      border: 1px solid #383943;

      border-radius: 12px;

      color: white;

      font-size: 16px;

    }

    h2 { font-size: 18px; margin: 12px 0 16px; }
